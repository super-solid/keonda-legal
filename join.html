<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Keonda · Te invitaron</title>
<meta name="description" content="Te invitaron a Keonda, la red náutica del Mediterráneo. Instalá la app y ganan Aura vos y quien te invitó." />
<style>
  :root{
    --bg:#0A1929; --line:rgba(255,255,255,.09);
    --gold:#D4A83A; --text:#EAF1F7; --mute:#7F91A3;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,Segoe UI,Roboto,sans-serif;
    display:flex; align-items:center; justify-content:center; padding:24px; min-height:100vh;
  }
  .wrap{width:100%; max-width:420px; display:flex; flex-direction:column; align-items:center; gap:22px; text-align:center}
  .gift{font-size:40px; line-height:1}
  .kicker{font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:var(--mute); font-weight:600}
  .brand{font-family:Georgia,"Times New Roman",serif; font-size:56px; font-weight:700; letter-spacing:.5px; margin-top:4px}
  .lead{font-size:15px; line-height:1.5; color:var(--mute); max-width:340px}
  .code{border:1px solid var(--line); border-radius:16px; padding:14px 28px; display:flex; flex-direction:column; align-items:center; gap:4px; margin-top:2px}
  .code .lbl{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10px; letter-spacing:.14em; color:var(--mute)}
  .code .val{font-family:Georgia,serif; font-size:34px; font-weight:700; color:var(--gold); letter-spacing:2px}
  .btns{width:100%; display:flex; flex-direction:column; gap:10px; margin-top:4px}
  .btn{height:54px; border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:600; text-decoration:none; cursor:pointer}
  .btn.primary{background:var(--gold); color:#101a10}
  .btn.ghost{background:transparent; border:1px solid var(--line); color:var(--text)}
  .beta{font-family:ui-monospace,Menlo,monospace; font-size:12px; color:var(--mute); text-decoration:underline}
  .hidden{display:none}
</style>
</head>
<body>
  <div class="wrap">
    <div class="gift">🎁</div>
    <div>
      <div class="kicker">Te invitaron a</div>
      <div class="brand">Keonda</div>
    </div>
    <p class="lead">La red náutica del Mediterráneo. Instalá la app y arrancá — ganan Aura vos y quien te invitó.</p>
    <div id="codeBox" class="code hidden">
      <div class="lbl">CÓDIGO DE INVITACIÓN</div>
      <div id="codeVal" class="val"></div>
    </div>
    <div class="btns">
      <a id="openApp" class="btn primary" href="#">Abrir en la app</a>
      <a class="btn ghost" href="https://apps.apple.com/app/id6785094649">Descargá Keonda</a>
    </div>
    <a class="beta" href="https://testflight.apple.com/join/SXzXYut1">Probar la beta (TestFlight)</a>
  </div>

  <script>
    // Referral join landing (GitHub Pages, no Vercel). Reads ?ref=CODE, shows it,
    // and wires the deep link keonda://join?ref=CODE so an installed app opens
    // straight to the invite. Visitors without the app use the store buttons.
    (function () {
      var params = new URLSearchParams(location.search);
      var raw = (params.get("ref") || "").trim().toUpperCase();
      var code = /^[A-Z0-9]{4,16}$/.test(raw) ? raw : "";
      var deep = "keonda://join" + (code ? "?ref=" + encodeURIComponent(code) : "");
      if (code) {
        document.getElementById("codeVal").textContent = code;
        document.getElementById("codeBox").classList.remove("hidden");
      }
      document.getElementById("openApp").setAttribute("href", deep);
    })();
  </script>
</body>
</html>
